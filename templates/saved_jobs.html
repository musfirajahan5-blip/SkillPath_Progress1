<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Saved Jobs - CareerNest</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7ff;
            color: #26345f;
        }

        header {
            background: linear-gradient(
                135deg,
                #7048e8,
                #2563eb
            );
            color: white;
            padding: 35px 8%;
        }

        .container {
            width: 82%;
            margin: 35px auto;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(50,70,120,.1);
        }

        .btn {
            display: inline-block;
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

    </style>

</head>

<body>

<header>

    <h1>❤️ Saved Jobs</h1>

    <p>Your favourite career opportunities</p>

</header>


<div class="container">

    {% if jobs %}

        {% for job in jobs %}

            <div class="card">

                <h2>
                    {{ job.title }}
                </h2>

                <h3>
                    🏢 {{ job.company }}
                </h3>

                <p>
                    📍 {{ job.location }}
                </p>

                <p>
                    💰 {{ job.salary }}
                </p>

                <a class="btn"
                   href="{{ url_for('job_details', job_id=job.id) }}">

                    🔎 View Details

                </a>

            </div>

        {% endfor %}

    {% else %}

        <div class="card">

            <h2>
                💔 No Saved Jobs
            </h2>

            <p>
                Save interesting jobs and they will appear here.
            </p>

        </div>

    {% endif %}

</div>

</body>

</html>
